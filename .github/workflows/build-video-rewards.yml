name: Build video rewards
on:
  push:
    branches: [feat/video-rewards]
    paths:
      - 'scripts/add_video_rewards.py'
      - 'scripts/patch_video_runtime.py'
      - 'scripts/patch_video_tests.py'
      - '.github/workflows/build-video-rewards.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/video-rewards
      - name: Ensure video tools
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -version | head -1
      - name: Build videos and integrate reward UI
        run: |
          python3 scripts/add_video_rewards.py
          python3 scripts/patch_video_runtime.py
          python3 scripts/patch_video_tests.py
      - name: Syntax checks
        run: |
          node --check game.js
          node --check item-art.js
          node --check sw.js
          test -s assets/video/title-loop.mp4
          test -s assets/video/repair-1.mp4
          test -s assets/video/repair-5.mp4
      - name: Install browser tests
        run: |
          python3 -m pip install playwright==1.57.0 Pillow==11.3.0
          python3 -m playwright install --with-deps chromium webkit
      - name: Run complete local regression suite
        env:
          BASE_URL: http://127.0.0.1:8765/
          RESULT_DIR: test-results/video-build
        run: |
          python3 -m http.server 8765 >/tmp/rin-video-http.log 2>&1 &
          python3 tests/smoke.py
          python3 tests/youth.py
          python3 tests/atelier4.py
          python3 tests/video.py
      - name: Commit only tested application and movie files
        run: |
          git config user.name 'kouheim1979'
          git config user.email 'kouheim@gmail.com'
          git add index.html game.js youth.css sw.js tests/smoke.py tests/youth.py tests/atelier4.py tests/origin_offline.py tests/video.py .github/workflows/verify-game.yml assets/video/
          git commit -m 'feat: add title and repair reward movies'
          git push origin HEAD:feat/video-rewards
      - name: Package verified build
        run: git archive --format=zip --output=/tmp/rin-harbor-video-rewards.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rin-harbor-video-build
          path: |
            /tmp/rin-harbor-video-rewards.zip
            test-results/
          retention-days: 14
