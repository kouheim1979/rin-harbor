name: Verify Rin Harbor
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ['index.html', '*.css', '*.js', 'manifest.webmanifest', 'assets/art-v1/**', 'assets/art-hd/**', 'assets/video/**', 'tests/**', '.github/workflows/verify-game.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Set up test browsers and movie verifier
        run: |
          python3 -m pip install playwright==1.57.0 Pillow==11.3.0
          python3 -m playwright install --with-deps chromium webkit
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffprobe -version | head -1
      - name: Check syntax, movie assets, and start local server
        run: |
          node --check game.js
          node --check item-art.js
          node --check sw.js
          node tests/guide-logic.cjs
          test -s assets/video/title-loop.mp4
          test -s assets/video/repair-1.mp4
          test -s assets/video/repair-5.mp4
          python3 -m http.server 8765 > /tmp/rin-http.log 2>&1 &
      - name: Chromium and WebKit regression tests
        env:
          BASE_URL: http://127.0.0.1:8765/
          RESULT_DIR: test-results/local
        run: |
          python3 tests/smoke.py
          python3 tests/youth.py
          python3 tests/atelier4.py
          python3 tests/video.py
          python3 tests/guide.py
      - name: Wait for published release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          python3 - <<'PY'
          import time,urllib.request,hashlib
          from pathlib import Path
          expected=hashlib.sha256(Path('game.js').read_bytes()).hexdigest()
          for attempt in range(90):
              try:
                  req=urllib.request.Request('https://kouheim1979.github.io/rin-harbor/game.js?verification='+str(time.time()),headers={'Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=20) as response: actual=response.read()
                  if hashlib.sha256(actual).hexdigest()==expected:
                      print('Published JavaScript matches this release.');break
              except Exception: pass
              time.sleep(5)
          else: raise RuntimeError('Expected release was not published in time')
          PY
      - name: Verify actual public URL including movies, inventory and offline reload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          BASE_URL: https://kouheim1979.github.io/rin-harbor/
          RESULT_DIR: test-results/published
        run: |
          python3 tests/smoke.py
          python3 tests/youth.py
          python3 tests/atelier4.py
          python3 tests/video.py
          python3 tests/guide.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rin-harbor-browser-results
          path: test-results/
          retention-days: 14
