<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>リンハーバー</title>
<meta http-equiv="refresh" content="0;url=./index.html">
<script>
(function(){
  const target='./index.html'+location.search+location.hash;
  try{
    if(window.top!==window.self){window.top.location.replace(target);return;}
  }catch(_e){}
  location.replace(target);
})();
</script>
</head>
<body><a href="./index.html" target="_top">リンハーバーを開く</a></body>
</html>
